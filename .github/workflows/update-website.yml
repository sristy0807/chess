name: Update website

# When this game changes, ask the portfolio site (sristy0807/sristy) to copy it in.
# Needs a repo secret SITE_TOKEN (fine-grained token with Contents: read & write on sristy0807/sristy).
# Without the secret nothing breaks: the site's own sync picks the change up within ~15 minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Tell the website to sync
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "::notice::No SITE_TOKEN secret set. The website will sync this change on its next scheduled run (every 15 min)."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sristy0807/sristy/dispatches \
            -d '{"event_type":"game-updated","client_payload":{"repo":"${{ github.repository }}"}}'
          echo "Website sync requested."
